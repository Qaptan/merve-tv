name: Kanal listesi

on:
  schedule:
    - cron: "0 1 * * *"   # her gece 04:00 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanal-listesi
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tr.json üret
        run: python pipeline/build_tr.py -o data/tr.json
      - name: Değiştiyse kaydet
        run: |
          git config user.name "merve-bot"
          git config user.email "merve-bot@users.noreply.github.com"
          git add data/tr.json
          git diff --cached --quiet || git commit -m "Kanal listesi güncellendi"
          git push
